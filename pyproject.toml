[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensitive-word-analyzer"
version = "1.0.0"
description = "Safe, rule-driven static triage for suspicious files"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Thu Rein Oo" }]
keywords = ["cybersecurity", "malware-analysis", "static-analysis", "ioc"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensitive_word_analyzer = ["data/*.json"]
